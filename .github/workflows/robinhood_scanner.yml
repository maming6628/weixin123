name: Robinhood Chain Scanner

on:
  schedule:
    - cron: "*/10 * * * *"   # 每10分钟（GitHub 实际可能延迟几分钟）
  workflow_dispatch:

permissions:
  contents: write            # 需要写回 seen_rh.json 去重

concurrency:
  group: robinhood-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Run scanner
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python robinhood_scanner.py
      - name: Save state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add seen_rh.json
          git diff --cached --quiet || git commit -m "update seen_rh.json [skip ci]"
          git pull --rebase && git push
